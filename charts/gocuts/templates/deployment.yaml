apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gocuts.fullname" . }}
  labels:
    {{- include "gocuts.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gocuts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.key }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gocuts.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gocuts.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GOCUTS_CONFIG
              value: {{ .Values.config.mountPath | quote }}
            - name: GOCUTS_ADDR
              value: {{ printf ":%v" .Values.containerPort | quote }}
            - name: GOCUTS_SUGGEST
              value: {{ .Values.settings.suggest | quote }}
            - name: GOCUTS_LIST
              value: {{ .Values.settings.list | quote }}
            {{- with .Values.settings.baseUrl }}
            - name: GOCUTS_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.key }}
            - name: GOCUTS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gocuts.fullname" . }}
                  key: key
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          # tcpSocket probes instead of httpGet: every route returns 403
          # when key auth (GOCUTS_KEY) is enabled.
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.config.mountPath }}
              subPath: gocuts.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "gocuts.fullname" . }}-config
        - name: tmp
          emptyDir: {}